name: Release

on:
  push:
    branches:
      - ci

  workflow_dispatch:
    inputs:
      runtime_tag:
        description: "Exact Mineshaft runtime tag, e.g. v1.7.0. Leave empty for a launcher-only release."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: launcher-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show toolchains
        shell: bash
        run: |
          set -euo pipefail

          swift --version
          rustc --version
          cargo --version
          gh --version

      - name: Determine runtime and launcher version
        id: version
        env:
          GH_TOKEN: ${{ secrets.MINESHAFT_READ_TOKEN }}
          REQUESTED_RUNTIME_TAG: ${{ inputs.runtime_tag }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --tags

          # Version scheme:
          #   1.L.R
          #
          #   1 = fixed major version
          #   L = runtime/library revision
          #   R = launcher revision
          #
          # Runtime-triggered release:
          #   exact runtime v1.L.0 -> launcher v1.L.0
          #
          # Launcher push/manual release:
          #   same runtime L -> increment R

          if [[ -n "${REQUESTED_RUNTIME_TAG:-}" ]]; then
            RUNTIME_TAG="$REQUESTED_RUNTIME_TAG"

            if [[ "$RUNTIME_TAG" != v* ]]; then
              RUNTIME_TAG="v$RUNTIME_TAG"
            fi

            RELEASE_KIND="runtime"
          else
            RUNTIME_TAG="$(
              gh release view \
                --repo MiningOrca/orcaunlocker-mineshaft \
                --json tagName \
                --jq '.tagName'
            )"

            if [[ -z "$RUNTIME_TAG" ]]; then
              echo "Could not determine latest Mineshaft release." >&2
              exit 1
            fi

            RELEASE_KIND="launcher"
          fi

          if [[ ! "$RUNTIME_TAG" =~ ^v1\.([0-9]+)\.0$ ]]; then
            echo "Invalid runtime tag: $RUNTIME_TAG" >&2
            echo "Expected runtime version format: v1.L.0" >&2
            exit 1
          fi

          LIB_REV="${BASH_REMATCH[1]}"

          # Make sure the requested/existing runtime release is real.
          gh release view "$RUNTIME_TAG" \
            --repo MiningOrca/orcaunlocker-mineshaft \
            >/dev/null

          if [[ "$RELEASE_KIND" == "runtime" ]]; then
            # A new runtime defines a new library revision and resets
            # launcher revision to zero.
            LAUNCHER_REV=0
          else
            # A launcher-only release increments the third component.
            CURRENT_TAG="$(
              git tag \
                --list 'v1.[0-9]*.[0-9]*' \
                --sort=-version:refname \
                | head -n 1
            )"

            if [[ -z "$CURRENT_TAG" ]]; then
              CURRENT_LIB_REV=0
              CURRENT_LAUNCHER_REV=0
            else
              CURRENT_VERSION="${CURRENT_TAG#v}"
              IFS='.' read -r CURRENT_MAJOR CURRENT_LIB_REV CURRENT_LAUNCHER_REV \
                <<< "$CURRENT_VERSION"

              if [[ "$CURRENT_MAJOR" != "1" ]]; then
                echo "Unexpected launcher major version: $CURRENT_TAG" >&2
                exit 1
              fi

              if [[ ! "$CURRENT_LIB_REV" =~ ^[0-9]+$ || \
                    ! "$CURRENT_LAUNCHER_REV" =~ ^[0-9]+$ ]]; then
                echo "Invalid launcher tag: $CURRENT_TAG" >&2
                exit 1
              fi
            fi

            if (( CURRENT_LIB_REV > LIB_REV )); then
              echo "Launcher tag is ahead of the latest runtime." >&2
              echo "Launcher: ${CURRENT_TAG:-none}" >&2
              echo "Runtime:  $RUNTIME_TAG" >&2
              exit 1
            fi

            if (( CURRENT_LIB_REV == LIB_REV )); then
              LAUNCHER_REV=$((CURRENT_LAUNCHER_REV + 1))
            else
              # Runtime advanced but its automatic launcher release did not
              # exist yet. This is still a launcher change, so start at .1.
              LAUNCHER_REV=1
            fi
          fi

          VERSION="1.${LIB_REV}.${LAUNCHER_REV}"
          TAG="v$VERSION"

          if git ls-remote \
              --exit-code \
              --tags \
              origin \
              "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG" >&2
            exit 1
          fi

          echo "Release kind: $RELEASE_KIND"
          echo "Runtime tag: $RUNTIME_TAG"
          echo "Launcher version: $VERSION"
          echo "Launcher tag: $TAG"

          echo "release_kind=$RELEASE_KIND" >> "$GITHUB_OUTPUT"
          echo "runtime_tag=$RUNTIME_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download Mineshaft release
        id: mineshaft
        env:
          GH_TOKEN: ${{ secrets.MINESHAFT_READ_TOKEN }}
          MINESHAFT_TAG: ${{ steps.version.outputs.runtime_tag }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_DIR="$RUNNER_TEMP/mineshaft-release"
          UNPACK_DIR="$RUNNER_TEMP/mineshaft-unpacked"

          rm -rf "$RELEASE_DIR" "$UNPACK_DIR"
          mkdir -p "$RELEASE_DIR" "$UNPACK_DIR"

          echo "Using Mineshaft release: $MINESHAFT_TAG"

          gh release download "$MINESHAFT_TAG" \
            --repo MiningOrca/orcaunlocker-mineshaft \
            --dir "$RELEASE_DIR"

          echo
          echo "Downloaded assets:"
          find "$RELEASE_DIR" -maxdepth 1 -type f -print

          if [[ -z "$(find "$RELEASE_DIR" -maxdepth 1 -type f -print -quit)" ]]; then
            echo "Mineshaft release contains no assets." >&2
            exit 1
          fi

          echo
          echo "Preparing runtime:"

          while IFS= read -r -d '' file; do
            case "$file" in
              *.zip)
                echo "Extracting ZIP: $(basename "$file")"
                /usr/bin/ditto \
                  -x -k \
                  "$file" \
                  "$UNPACK_DIR"
                ;;

              *.tar.gz|*.tgz)
                echo "Extracting tarball: $(basename "$file")"
                /usr/bin/tar \
                  -xzf "$file" \
                  -C "$UNPACK_DIR"
                ;;

              *)
                echo "Copying asset: $(basename "$file")"
                cp "$file" "$UNPACK_DIR/"
                ;;
            esac
          done < <(
            find "$RELEASE_DIR" \
              -maxdepth 1 \
              -type f \
              -print0
          )

          echo
          echo "Unpacked contents:"
          find "$UNPACK_DIR" -maxdepth 4 -print

          MANIFEST_COUNT="$(
            find "$UNPACK_DIR" \
              -type f \
              -name manifest.json \
              -print \
              | wc -l \
              | tr -d ' '
          )"

          if [[ "$MANIFEST_COUNT" != "1" ]]; then
            echo >&2
            echo "Expected exactly one manifest.json, found: $MANIFEST_COUNT" >&2
            exit 1
          fi

          MANIFEST="$(
            find "$UNPACK_DIR" \
              -type f \
              -name manifest.json \
              -print \
              | head -n 1
          )"

          RUNTIME_DIR="$(dirname "$MANIFEST")"

          echo
          echo "Runtime directory: $RUNTIME_DIR"
          echo "Runtime files:"
          find "$RUNTIME_DIR" -maxdepth 2 -type f -print

          echo "runtime_dir=$RUNTIME_DIR" >> "$GITHUB_OUTPUT"
          echo "tag=$MINESHAFT_TAG" >> "$GITHUB_OUTPUT"

      - name: Build Orca Unlocker
        env:
          ORCAUNLOCKER_RUNTIME_DIR: ${{ steps.mineshaft.outputs.runtime_dir }}
          ORCAUNLOCKER_VERSION: ${{ steps.version.outputs.version }}
          ORCAUNLOCKER_BUILD: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Launcher version: $ORCAUNLOCKER_VERSION"
          echo "Build number: $ORCAUNLOCKER_BUILD"
          echo "Runtime: ${{ steps.mineshaft.outputs.tag }}"
          echo

          ./scripts/build-app.sh

      - name: Verify release bundle
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          APP="dist/Orca Unlocker.app"
          ZIP="dist/Orca-Unlocker-macOS.zip"
          PLIST="$APP/Contents/Info.plist"
          RUNTIME="$APP/Contents/Resources/Runtime"

          test -d "$APP"
          test -f "$ZIP"
          test -f "$PLIST"
          test -f "$RUNTIME/manifest.json"

          /usr/bin/plutil -lint "$PLIST"

          ACTUAL_VERSION="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              "$PLIST"
          )"

          if [[ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "Bundle version mismatch." >&2
            echo "Expected: $EXPECTED_VERSION" >&2
            echo "Actual:   $ACTUAL_VERSION" >&2
            exit 1
          fi

          /usr/bin/codesign \
            --verify \
            --strict \
            "$APP"

          /usr/bin/unzip -tq "$ZIP"

          shasum -a 256 "$ZIP" > "$ZIP.sha256"

          echo
          echo "Release artifacts:"
          ls -lh "$ZIP" "$ZIP.sha256"

          echo
          echo "SHA-256:"
          cat "$ZIP.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$RELEASE_TAG" \
            "dist/Orca-Unlocker-macOS.zip" \
            "dist/Orca-Unlocker-macOS.zip.sha256" \
            --target "$GITHUB_SHA" \
            --title "Orca Unlocker $RELEASE_TAG" \
            --generate-notes \
            --latest

      - name: Release summary
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          MINESHAFT_TAG: ${{ steps.mineshaft.outputs.tag }}
          RELEASE_KIND: ${{ steps.version.outputs.release_kind }}
        shell: bash
        run: |
          {
            echo "## Orca Unlocker $RELEASE_TAG"
            echo
            echo "- Release kind: \`$RELEASE_KIND\`"
            echo "- Launcher commit: \`$GITHUB_SHA\`"
            echo "- Mineshaft runtime: \`$MINESHAFT_TAG\`"
            echo "- Build: \`${{ github.run_number }}\`"
            echo "- Asset: \`Orca-Unlocker-macOS.zip\`"
          } >> "$GITHUB_STEP_SUMMARY"