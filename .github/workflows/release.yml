name: Release

on:
  push:
    branches:
      - main
      - ci

  workflow_dispatch:
    inputs:
      runtime_tag:
        description: "Exact Mineshaft runtime tag, e.g. v9"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: launcher-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show toolchains
        shell: bash
        run: |
          set -euo pipefail

          swift --version
          rustc --version
          cargo --version
          gh --version

      - name: Determine runtime and launcher version
        id: version
        env:
          GH_TOKEN: ${{ secrets.MINESHAFT_READ_TOKEN }}
          REQUESTED_RUNTIME_TAG: ${{ inputs.runtime_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "Missing repository secret: MINESHAFT_READ_TOKEN" >&2
            exit 1
          fi

          git fetch --force --tags

          CURRENT_TAG="$(
            git tag \
              --list 'v1.[0-9]*.[0-9]*' \
              --sort=-version:refname \
              | head -n 1
          )"

          if [[ -z "$CURRENT_TAG" ]]; then
            CURRENT_TAG="v1.0.0"
          fi

          CURRENT_VERSION="${CURRENT_TAG#v}"
          IFS='.' read -r MAJOR LIB_REV LAUNCHER_REV <<< "$CURRENT_VERSION"

          if [[ "$MAJOR" != "1" || \
                ! "$LIB_REV" =~ ^[0-9]+$ || \
                ! "$LAUNCHER_REV" =~ ^[0-9]+$ ]]; then
            echo "Invalid current launcher tag: $CURRENT_TAG" >&2
            exit 1
          fi

          if [[ -n "${REQUESTED_RUNTIME_TAG:-}" ]]; then
            RELEASE_KIND="runtime"
            RUNTIME_TAG="$REQUESTED_RUNTIME_TAG"

            if [[ ! "$RUNTIME_TAG" =~ ^v[0-9]+$ ]]; then
              echo "Invalid runtime tag: $RUNTIME_TAG" >&2
              echo "Expected format: v8, v9, v10, ..." >&2
              exit 1
            fi

            # Verify that the exact runtime release exists.
            gh release view "$RUNTIME_TAG" \
              --repo MiningOrca/orcaunlocker-mineshaft \
              >/dev/null

            LIB_REV=$((LIB_REV + 1))
            LAUNCHER_REV=0
          else
            RELEASE_KIND="launcher"

            RUNTIME_TAG="$(
              gh release view \
                --repo MiningOrca/orcaunlocker-mineshaft \
                --json tagName \
                --jq '.tagName'
            )"

            if [[ -z "$RUNTIME_TAG" ]]; then
              echo "Could not determine latest Mineshaft release." >&2
              exit 1
            fi

            LAUNCHER_REV=$((LAUNCHER_REV + 1))
          fi

          VERSION="1.${LIB_REV}.${LAUNCHER_REV}"
          TAG="v$VERSION"

          if git ls-remote \
              --exit-code \
              --tags \
              origin \
              "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG" >&2
            exit 1
          fi

          echo "Release kind: $RELEASE_KIND"
          echo "Previous launcher tag: $CURRENT_TAG"
          echo "Mineshaft runtime: $RUNTIME_TAG"
          echo "Launcher version: $VERSION"
          echo "Launcher tag: $TAG"

          echo "release_kind=$RELEASE_KIND" >> "$GITHUB_OUTPUT"
          echo "runtime_tag=$RUNTIME_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download Mineshaft release
        id: mineshaft
        env:
          GH_TOKEN: ${{ secrets.MINESHAFT_READ_TOKEN }}
          MINESHAFT_TAG: ${{ steps.version.outputs.runtime_tag }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_DIR="$RUNNER_TEMP/mineshaft-release"
          UNPACK_DIR="$RUNNER_TEMP/mineshaft-unpacked"

          rm -rf "$RELEASE_DIR" "$UNPACK_DIR"
          mkdir -p "$RELEASE_DIR" "$UNPACK_DIR"

          echo "Using Mineshaft release: $MINESHAFT_TAG"

          gh release download "$MINESHAFT_TAG" \
            --repo MiningOrca/orcaunlocker-mineshaft \
            --dir "$RELEASE_DIR"

          echo
          echo "Downloaded assets:"
          find "$RELEASE_DIR" -maxdepth 1 -type f -print

          if [[ -z "$(find "$RELEASE_DIR" -maxdepth 1 -type f -print -quit)" ]]; then
            echo "Mineshaft release contains no assets." >&2
            exit 1
          fi

          echo
          echo "Preparing runtime:"

          while IFS= read -r -d '' file; do
            case "$file" in
              *.zip)
                echo "Extracting ZIP: $(basename "$file")"
                /usr/bin/ditto \
                  -x -k \
                  "$file" \
                  "$UNPACK_DIR"
                ;;

              *.tar.gz|*.tgz)
                echo "Extracting tarball: $(basename "$file")"
                /usr/bin/tar \
                  -xzf "$file" \
                  -C "$UNPACK_DIR"
                ;;

              *)
                echo "Copying asset: $(basename "$file")"
                cp "$file" "$UNPACK_DIR/"
                ;;
            esac
          done < <(
            find "$RELEASE_DIR" \
              -maxdepth 1 \
              -type f \
              -print0
          )

          echo
          echo "Unpacked contents:"
          find "$UNPACK_DIR" -maxdepth 4 -print

          MANIFEST_COUNT="$(
            find "$UNPACK_DIR" \
              -type f \
              -name manifest.json \
              -print \
              | wc -l \
              | tr -d ' '
          )"

          if [[ "$MANIFEST_COUNT" != "1" ]]; then
            echo >&2
            echo "Expected exactly one manifest.json, found: $MANIFEST_COUNT" >&2
            exit 1
          fi

          MANIFEST="$(
            find "$UNPACK_DIR" \
              -type f \
              -name manifest.json \
              -print \
              | head -n 1
          )"

          RUNTIME_DIR="$(dirname "$MANIFEST")"

          echo
          echo "Runtime directory: $RUNTIME_DIR"
          echo "Runtime files:"
          find "$RUNTIME_DIR" -maxdepth 2 -type f -print

          echo "runtime_dir=$RUNTIME_DIR" >> "$GITHUB_OUTPUT"
          echo "tag=$MINESHAFT_TAG" >> "$GITHUB_OUTPUT"

      - name: Build Orca Unlocker
        env:
          ORCAUNLOCKER_RUNTIME_DIR: ${{ steps.mineshaft.outputs.runtime_dir }}
          ORCAUNLOCKER_VERSION: ${{ steps.version.outputs.version }}
          ORCAUNLOCKER_BUILD: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Launcher version: $ORCAUNLOCKER_VERSION"
          echo "Build number: $ORCAUNLOCKER_BUILD"
          echo "Runtime: ${{ steps.mineshaft.outputs.tag }}"
          echo

          ./scripts/build-app.sh

      - name: Verify release bundle
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          APP="dist/Orca Unlocker.app"
          ZIP="dist/Orca-Unlocker-macOS.zip"
          PLIST="$APP/Contents/Info.plist"
          RUNTIME="$APP/Contents/Resources/Runtime"

          test -d "$APP"
          test -f "$ZIP"
          test -f "$PLIST"
          test -f "$RUNTIME/manifest.json"

          /usr/bin/plutil -lint "$PLIST"

          ACTUAL_VERSION="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              "$PLIST"
          )"

          if [[ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "Bundle version mismatch." >&2
            echo "Expected: $EXPECTED_VERSION" >&2
            echo "Actual:   $ACTUAL_VERSION" >&2
            exit 1
          fi

          /usr/bin/codesign \
            --verify \
            --strict \
            "$APP"

          /usr/bin/unzip -tq "$ZIP"

          shasum -a 256 "$ZIP" > "$ZIP.sha256"

          echo
          echo "Release artifacts:"
          ls -lh "$ZIP" "$ZIP.sha256"

          echo
          echo "SHA-256:"
          cat "$ZIP.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          MINESHAFT_TAG: ${{ steps.version.outputs.runtime_tag }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$RELEASE_TAG" \
            "dist/Orca-Unlocker-macOS.zip" \
            "dist/Orca-Unlocker-macOS.zip.sha256" \
            --target "$GITHUB_SHA" \
            --title "Orca Unlocker $RELEASE_TAG" \
            --notes "Mineshaft runtime: $MINESHAFT_TAG" \
            --latest

      - name: Release summary
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          MINESHAFT_TAG: ${{ steps.version.outputs.runtime_tag }}
          RELEASE_KIND: ${{ steps.version.outputs.release_kind }}
        shell: bash
        run: |
          {
            echo "## Orca Unlocker $RELEASE_TAG"
            echo
            echo "- Release kind: \`$RELEASE_KIND\`"
            echo "- Launcher commit: \`$GITHUB_SHA\`"
            echo "- Mineshaft runtime: \`$MINESHAFT_TAG\`"
            echo "- Build: \`${{ github.run_number }}\`"
            echo "- Asset: \`Orca-Unlocker-macOS.zip\`"
          } >> "$GITHUB_STEP_SUMMARY"
